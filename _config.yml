<p>I am a passionate software engineer with 10+ years of experience. I have a lot of expertise in software development mainly in Java and Python ecosystems. I have participated in developing services used by millions of users daily.  </p>

<p>My professional experience includes developing scalable and available systems, applying parallel and distributed computing techniques, and working with both monolithic and microservice architectures.</p>

<p>I have a strong foundation in Software Design, Object Oriented Programming, Functional Programming, Data Structures, and Algorithms.  I focus on producing efficient code that is easy to understand, verify, and modify. I adhere to clean coding principles that enhance quality and readability.</p>

<p>I have a particular interest in Artificial Intelligence (AI).  I am involved in large language models and their applications. I believe AI is about to disrupt software engineering, and I am happy/ready to embrace it. </p>

<p>I have been developing software for over a decade, and I still enjoy every aspect of it. I am always eager to learn new skills and technologies, as well as to share my knowledge and experience with others. Writing is another passion of mine, and I like to document my projects and ideas in a clear and concise way. </p>

<p><b>Keywords:</b> Java, Python, Parallel, Asynchronous and Distributed Computing, Clean Coding, Open Source Software, Spring Boot. </p>

