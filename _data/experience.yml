### Freelancer at Upwork

- **Period**: May 2023 - May 2024
- **Role**: Design and development of software applications for financial services. Design and development of chatbot
  applications.
- **Activities**:
    - **Copy Trade Bot**: Development of Java (17) based copy trade application. The main purpose of the application was
      to
      monitor and replay buy/sell activities of certain accounts. The application was integrated to ByBit Asset
      Exchange. The application was using ByBit API for the exchange integration. ByBit API also allows web hooks to
      publish realtime updates. Persistence layer MySQL and hibernate.
    - **Knowledge Base Chat Bot Application**: Design and development of a chatbot application. The chatbot utilized
      RAG (Retrieval Augmented Generation) pattern to generate answers based on a knowledge-base. Knowledge base was
      built by scrapping an official support site. Java (17) language was used in the development. OpenAI
      ChatGPT-3.5-Turbo
      and OpenAI embedding models were used. Pinecone vector store was used to store document embeddings. Persistence
      layer CockroachDB and hibernate.
    - **Bank Account KYC Application**: The application was developed using Java (17), Spring Boot. The purpose
      of the application was to run steps required before creating a bank account: Collect user information and build a
      contract, Sign the contract, Apply KYC Steps, Inform the clearing system about the success of the KYC.
      Docusign (web-forms) was used for collecting user information and signing. Persona was used to conduct KYC steps.
      Velox was used as the clearing systems. Docusign and Persona provides web hooks for realtime updates. Persistence
      layer CockroachDB and hibernate.
    - **Game Server Backend**: The application was developed using Java (17), Spring Boot. The application was
      provided as a backend to a suit of online game applications. Each online game used the backend to store game
      related data, creating and authenticating users. The backend exposed set of REST endpoints to be consumed by the
      online games. The backend server designed to achieve low latency. A monitoring suite based Prometheus (A framework
      to create and publish application metrics), Influxdb (A database to keep time series data) and Grafana (A
      dashboard application to display application metrics) was shipped with the application. K6 (a load testing
      framework) was used to do load testing. Persistence layer CockroachDB and hibernate.

### Co-Founder at TezosLand

- **Period**: Aug 2018 - Mar 2021
- **Role**: Setup, configuration and maintenance of the TezosLand.
- **Company**: TezosLand. TezosLand or Tezos-Land was a low fee, high-reliability baking service. Baking was the
  operation of validating transactions in the tezos blockchain which has a liquid delegated proof of stake (DPoS)
  consensus mechanism. In DPos tezos stakers delegate their stake to a Baker. The baker shares, aka redistributes,
  staking rewards with the stakers. TezosLand was a such baker which claimed having low fee and high reliability and
  respecting customer anonymity.
- **Activities**:
    - Development of a reward distribution software, which was later opensourced under the name of Tezos Reward
      Distributor (TRD).
    - Configuration of a local tezos blockchain node.
    - Following payment activities.
    - Following protocol upgrades and applying them to TezosLand servers.

### Software Engineer at i2i Systems

- **Company**: i2i Systems (At Istanbul)
- **Duration**: From May 2018 to Jun 2022 (4 years 2 months)
- **Responsibilities**: Involved in the design and development of Charging System and 5G Core components. Participation
  in the development of large scale, performance sensitive, and highly available systems was a key role.
- **Activities**:
    - **RECF Microservice**: Designed and developed a microservice for recurring billing and charging operations was
      designed and developed. This microservice, responsible for refreshing recurring packages of post-paid and pre-paid
      customers, handles the processing of millions of customer accounts daily. The microservice application was based
      on Java (17) and Spring Boot. The microservice application utilized the Akka framework for asynchronous
      processing. Oracle 12G and JDBC was utilized in the persistence layer. A clustering solution based on Akka
      Clustering was employed to enable multiple instances to run in parallel for load sharing and high availability.
      The microservice was designed to continue serving even in the most extreme scenarios and was geographically
      distributed to ensure service continuity in the event of a catastrophe at a data center. Kafka was used for both
      publishing and subscribing. The microservice was designed as a part of a larger online charging system which was
      developed by a large team of developers, testers and analysts which co-operated using scrum methodology.
    - **NSSF Microservice**: Designed and developed a microservice for the 5G network slice selection function (NSSF).
      Network slicing feature in 5G terminology allows the creation of multiple logical networks on top of a common
      shared physical network, essentially segmenting parts of the network for different users and/or use cases. The
      NSSF microservice facilitates the selection of the most appropriate slice for the user equipment (UE). The
      microservice application was based on Java (17) and Spring Boot. The microservice utilized the Akka framework for
      asynchronous processing. Hazelcast in-memory data grid solution was used as a distributed near cache. The
      microservice endpoints were designed in accordance with OpenAPI Specification Files and 5G Core Network
      specification files published by the 3GPP consortium.

